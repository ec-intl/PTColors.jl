---
name: Continuous-Integration

on:
  pull_request:
    types:
      - auto_merge_enabled
    branches:
      - staging
  merge_group:

permissions:
  contents: read
  checks: read

jobs:
  ci-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Preamble
        run: |
          echo "🎉 A ${{ github.event_name }} triggered a ${{ runner.os }} job."
          echo "🔎 The branch is ${{ github.ref_name }} in ${{ github.repository }}."

      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Run PTColors tests in Docker
        run: |
          docker compose --profile ci-testing up \
            --build \
            --exit-code-from ci-testing

      - name: Clean up Docker resources
        if: always()
        run: |
          docker compose --profile ci-testing down \
            --volumes \
            --remove-orphans
